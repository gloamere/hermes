[global]
    run as user = netdata

[db]
    update every = 5
    mode = dbengine
    storage tiers = 3
    dbengine multihost disk space MB = 512
    dbengine tier 1 multihost disk space MB = 128
    dbengine tier 2 multihost disk space MB = 64

[web]
    bind to = 127.0.0.1:19999
    allow connections from = localhost 127.0.0.1

[ml]
    enabled = no

[health]
    enabled = yes

[registry]
    enabled = no

[plugins]
    python.d = yes
